[package]
name = "edges-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
# Compile SQLite into the core, so every edge gets the same version.
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Generates the Swift and Kotlin bindings from the annotations in bridge.rs.
uniffi = { version = "=0.32.2", default-features = false }
