# One graph for the whole app: the Rust core, the terminal edge, the SwiftUI
# edge, and the Jetpack Compose edge. Every edge depends only on the core
# (plus its own platform libraries), so the graph stays shallow and wide.

[workspace]
include = ["once.toml"]
exclude = ["**/Cargo.toml"]

[modules]
paths = ["modules/*.star"]

[infrastructure.cache]
provider = "tuist"

[infrastructures.tuist]
kind = "tuist"
account = "tuist"
project = "native-edges"

# Third-party crates, resolved from Cargo.lock once per Rust target.

[[target]]
name = "CoreDependencies"
kind = "cargo_dependencies"

[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
vendor_dir = ".once/vendor"
resolver_inputs = ["Cargo.toml", "Cargo.lock", "core/Cargo.toml", "cli/Cargo.toml"]

[[target]]
name = "CoreIOSDependencies"
kind = "cargo_dependencies"

[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
vendor_dir = ".once/vendor"
target = "aarch64-apple-ios-sim"
resolver_inputs = ["Cargo.toml", "Cargo.lock", "core/Cargo.toml", "cli/Cargo.toml"]

[[target]]
name = "CoreAndroidDependencies"
kind = "cargo_dependencies"

[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
vendor_dir = ".once/vendor"
target = "aarch64-linux-android"
build_script_tools = ["aarch64-linux-android-clang", "clang", "llvm-ar"]
resolver_inputs = ["Cargo.toml", "Cargo.lock", "core/Cargo.toml", "cli/Cargo.toml"]

# The headless core, built once per edge. Diesel finds the SQL migrations it
# compiles in relative to CARGO_MANIFEST_DIR, as it would under Cargo.

[[target]]
name = "Core"
kind = "rust_library"
srcs = ["core/src/**/*.rs", "core/migrations/**/*.sql"]
deps = ["./CoreDependencies"]

[target.attrs]
crate_name = "edges_core"
crate_root = "core/src/lib.rs"
cargo_package = "edges-core"
edition = "2024"
rustc_env = { CARGO_MANIFEST_DIR = "core" }

[[target]]
name = "CoreTests"
kind = "rust_test"
srcs = ["core/src/**/*.rs", "core/migrations/**/*.sql"]
deps = ["./CoreDependencies"]

[target.attrs]
crate_name = "edges_core"
crate_root = "core/src/lib.rs"
cargo_package = "edges-core"
edition = "2024"
rustc_env = { CARGO_MANIFEST_DIR = "core" }
rustc_flags = ["-Dwarnings"]

[[target]]
name = "CoreIOS"
kind = "rust_library"
srcs = ["core/src/**/*.rs", "core/migrations/**/*.sql"]
deps = ["./CoreIOSDependencies"]

[target.attrs]
crate_name = "edges_core"
crate_root = "core/src/lib.rs"
cargo_package = "edges-core"
edition = "2024"
rustc_env = { CARGO_MANIFEST_DIR = "core" }
target = "aarch64-apple-ios-sim"
crate_type = "staticlib"

[[target]]
name = "CoreAndroid"
kind = "rust_library"
srcs = ["core/src/**/*.rs", "core/migrations/**/*.sql"]
deps = ["./CoreAndroidDependencies"]

[target.attrs]
crate_name = "edges_core"
crate_root = "core/src/lib.rs"
cargo_package = "edges-core"
edition = "2024"
rustc_env = { CARGO_MANIFEST_DIR = "core" }
target = "aarch64-linux-android"
crate_type = "cdylib"
android_abi = "arm64-v8a"
android_api = 26
linker_flags = ["-Wl,-z,max-page-size=16384"]

# The terminal edge.

[[target]]
name = "CLI"
kind = "rust_binary"
srcs = ["cli/src/**/*.rs"]
deps = ["./Core", "./CoreDependencies"]

[target.attrs]
crate_name = "edges"
crate_root = "cli/src/main.rs"
cargo_package = "edges-cli"
edition = "2024"
rustc_flags = ["-Dwarnings"]

# The SwiftUI edge.

[[target]]
name = "CoreFFI"
kind = "apple_system_module"

[target.attrs]
modulemap = "core/include/module.modulemap"
headers = ["core/include/edges_core.h"]
header_dirs = ["core/include"]

[[target]]
name = "SimulatorSDK"
kind = "apple_sdk"

[target.attrs]
sdk = "iphonesimulator"

[[target]]
name = "IOS"
kind = "apple_application"
srcs = ["ios/Sources/**/*.swift"]
deps = ["./CoreIOS", "./CoreFFI", "./SimulatorSDK"]

[target.attrs]
platform = "ios"
bundle_id = "dev.tuist.edges"
product_name = "Edges"
minimum_os = "18.0"
sdk_variant = "simulator"
families = ["iphone"]
sdk_frameworks = ["AuthenticationServices", "Security"]
info_plist = "ios/Info.plist"
entitlements = "ios/Edges.entitlements"
asset_catalogs = ["ios/Assets.xcassets"]
app_icon = "AppIcon"

# The Jetpack Compose edge.

[[target]]
name = "Compose"
kind = "maven_android_libraries"
srcs = ["android/maven.lock.json"]

[[target]]
name = "Android"
kind = "android_binary"
srcs = ["android/src/**/*.kt"]
deps = ["./CoreAndroid", "./Compose"]

[target.attrs]
application_id = "dev.tuist.edges"
manifest = "android/AndroidManifest.xml"
resource_files = ["android/res/**"]
resource_dirs = ["android/res"]
compile_sdk = 36
target_sdk_version = 36
min_sdk_version = 26
build_tools_version = "36.0.0"
version_code = 1
version_name = "0.1.0"
launch_activity = ".MainActivity"
signing = "debug"
kotlinc_opts = ["-Xplugin=.once/kotlin/compose-compiler-plugin.jar", "-jvm-target", "17"]
